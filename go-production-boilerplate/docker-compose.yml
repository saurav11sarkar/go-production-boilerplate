services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: go_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/go_production?sslmode=disable
      LOCAL_UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/go_production?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/bin/migrate", "up"]
    profiles: ["tools"]

  seed:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/go_production?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/bin/seed"]
    profiles: ["tools"]

volumes:
  postgres_data:
  api_uploads:
