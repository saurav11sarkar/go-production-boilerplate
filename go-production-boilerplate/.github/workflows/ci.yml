name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod tidy
      - run: gofmt -w $(find . -name '*.go') && git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/api ./cmd/migrate ./cmd/seed
